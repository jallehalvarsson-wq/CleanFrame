name: New movies feed

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/feed/requirements.txt
      - run: python scripts/feed/scrape.py --output docs/feed/new-se.json
      - name: Publish feed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B feed
          git add docs/feed/new-se.json
          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi
          git commit -m "Update Sweden new-movies feed"
          git push --force origin feed
